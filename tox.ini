[tox]
envlist =
    clean
    py36-django{22,32}
    py37-django{22,32}
    py38-django{22,32,42}
    py39-django{22,32,42}
    py310-django{32,42,52}
    py311-django{42,52}
    py312-django{42,52,60,61}
    py313-django{52,60,61}
    py314-django{52,60,61}
    py314-latest
    browser
    docs
    warnings

isolated_build = true
skip_missing_interpreters = true


[latest]
deps =
    https://github.com/django/django/archive/main.tar.gz


[testenv]
description = Main testing logic for most python/django combinations.
extras = test
commands =
    python -m django --version
    python ./runtests.py -n auto --cov=. --ignore=.tox --disable-pytest-warnings --cov-report= --cov-append {toxinidir}
setenv = PYTHONDONTWRITEBYTECODE=1
deps =
    django22: Django>=2.2,<3.0
    django32: Django>=3.2,<4.0
    django42: Django>=4.2,<5.0
    django52: Django>=5.2,<6.0
    django60: Django>=6.0,<6.1
    django61: Django>=6.1,<6.2
    latest: {[latest]deps}

[testenv:clean]
description = Clean project for running coverage.
allowlist_externals = rm
deps = coverage
skip_install = true
commands =
    coverage erase
    rm -f {toxinidir}/coverage.lcov

[testenv:browser]
description = Test the dump page's JavaScript in headless Firefox.
basepython = python3.14
extras =
    test
    browser
setenv =
    PYTHONDONTWRITEBYTECODE=1
    DJANGO_DD_SELENIUM_HEADLESS=true
deps = Django>=6.1,<6.2
commands = python ./runtests.py --cov=. --ignore=.tox --disable-pytest-warnings --cov-report= --cov-append tests/django_dump_die_tests/browser

[testenv:docs]
description = Test that docs can build properly.
extras = doc
commands = python -m sphinx -WE docs/source docs/build

[testenv:warnings]
description = Check for raised warnings on bleeding edge of project.
ignore_outcome = True
unignore_outcomes = True
commands = python ./runtests.py -W error {posargs}
deps =
    {[latest]deps}


[gh-actions]
python =
    3.6: py36
    3.7: py37
    3.8: py38
    3.9: py39
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314, browser, docs, warnings
