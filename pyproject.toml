# Build properties for deployment.
[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"


# region Core Project Settings and Metadata

[project]
name = "django-dump-die"
description = "A Django app to add Laravel/Symfony-like dump and die functionality."
readme = "README.md"
authors = [
    { name = "David Barnes", email = "barnesdavidj@gmail.com" },
    { name = "Brandon Rodriguez", email = "brodriguez8774@gmail.com" },
]
maintainers = [
    { name = "David Barnes", email = "barnesdavidj@gmail.com" },
    { name = "Brandon Rodriguez", email = "brodriguez8774@gmail.com" },
]
license = { file = "LICENSE" }
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
keywords = [
    "debug",
    "dd",
    "die",
    "django",
    "dump",
    "inspect",
    "tool",
]
requires-python = ">=3.10"
dependencies = ["django >= 4.2"]
dynamic = ["version"]

[project.optional-dependencies]
browser = [
    "selenium",
]
dev = [
    "colorama",
    "coverage",
    "ruff",
]
doc = [
    "doc8",
    "rstcheck",
    "sphinx",
    "sphinx-autobuild",
    "sphinx-rtd-theme",
]
test = [
    "coverage",
    "django-expanded-test-cases",
    "freezegun",
    "pillow",
    # pytest 9 reports subTest results itself.
    "pytest>=9",
    "pytest-cov",
    "pytest-django",
    "pytest-xdist",
    "pytz",
]

[project.urls]
Homepage = "https://github.com/djbarnes/django-dump-die"
Documentation = "https://django-dump-die.readthedocs.io/en/stable/"
Changelog = "https://django-dump-die.readthedocs.io/en/stable/version_history.html"
"Bug Tracker" = "https://github.com/djbarnes/django-dump-die/issues"
"Source Code" = "https://github.com/djbarnes/django-dump-die"

# endregion Core Project Settings and Metadata


# region Third-Party Package Settings

# "uv" development environment settings.
[tool.uv]
# The development environment (`uv sync --all-extras`) uses a recent Python. The package itself supports Python 3.10
# and later (requires-python); tox tests the older versions.
environments = ["python_version >= '3.12'"]

# "Ruff" formatter and linter settings.
[tool.ruff]
line-length = 120
# The oldest Python to support comes from requires-python.
# Python files only; code examples in Markdown keep the docs' style.
extend-exclude = ["*.md", "docs/build"]
# The middleware adds dd() and dump() to builtins, so calling code doesn't import them.
builtins = ["dd", "dump"]

[tool.ruff.lint]
# pyflakes, pycodestyle, bugbear, pep8-naming, Ruff's pylint rules, and its Django rules.
select = ["F", "E", "W", "B", "N", "PL", "DJ"]
ignore = [
    # The "too many ..." checks, which the project's pylint configuration also disabled.
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0917",
    # Magic values in comparisons (an optional pylint extension).
    "PLR2004",
    # `else: if` instead of `elif` (pylint's no-else checks were disabled).
    "PLR5501",
]

[tool.ruff.lint.pep8-naming]
# Test assertion helpers follow unittest's naming.
extend-ignore-names = ["assert*"]

[tool.ruff.lint.per-file-ignores]
# This module re-exports the views for `from django_dump_die.views import ...`.
"django_dump_die/views/__init__.py" = ["F401"]
# The sample models, and the test models, are dumped with Django's own __str__.
"django_dump_die/views/example_helpers.py" = ["DJ008"]
"tests/django_dump_die_tests/django_test_project/models.py" = ["DJ008"]

[tool.setuptools]
zip-safe = false
include-package-data = true
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
exclude = ["tests*"]
namespaces = false

[tool.rstcheck]
# Sphinx directives, which rstcheck doesn't know. The docs build checks them instead.
ignore_directives = ["automodule"]
# Only report problems. Info messages include labels that other files reference, which rstcheck can't see.
report_level = "WARNING"

# endregion Third-Party Package Settings


# region Testing Settings

[tool.pytest.ini_options]
python_files = ["tests.py", "*/test_*.py"]
testpaths = ["tests"]

DJANGO_SETTINGS_MODULE = "django_dump_die_tests.django_test_project.settings"
pythonpath = [".", "tests"]
# Constructed as
#   {action}:{message}:{category}:{module}:{lineno}
#
# For more details, see:
#   https://docs.pytest.org/en/stable/how-to/capture-warnings.html
#   https://docs.python.org/3/library/warnings.html#warning-filter
#   https://stackoverflow.com/questions/57925071/how-do-i-avoid-getting-deprecationwarning-from-inside-dependencies-with-pytest
filterwarnings = ""

[tool.coverage.run]
branch = true
# Record relative paths, so that results from runners and containers with different checkout paths combine.
relative_files = true
omit = [
    # Omit the virtual environment
    "./.venv/*",
    # Omit the test folders
    "*/tests/*",
    "*/tests.py",
    # Omit the migration folders
    "*/migrations/*",
    # Omit django files
    "*/manage.py",
    "*/wsgi.py",
    "*/settings.py",
    "*/asgi.py",
    # Omit management commands
    "*/management/commands/*.py",
    # Omit init files.
    "*/__init__.py",
    # Omit setup files
    "./setup.py",
    # Omit Testing Scripts
    "./runpytests.py",
    "./runtests.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "return render.request, .*",
    "except ImportError:",
    "except AttributeError:",
    "except NotImplementedError:",
    "except Exception:\\n\\s*pass",
    "if PYTZ_PRESENT:",
]

# endregion Testing Settings
