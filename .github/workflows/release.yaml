name: Publish Release
on:
  push:
    tags:
      # Only version tags, such as 0.2.0. The release environment also only accepts tags shaped like these.
      - "[0-9]+.[0-9]+.[0-9]+"

# Jobs only read the repository. The publish job also asks for an ID token, for trusted publishing on PyPI.
permissions:
  contents: read

jobs:
  release-build:
    name: Build release distributions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The job doesn't push to the repository, so the checkout doesn't keep the token.
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

      # Builds the sdist and wheel with the project's build backend (flit_core).
      - name: build release distributions
        run: |
          uv build

      # The release's version comes from __version__, not from the tag. Stop if they differ, such as a tag pushed on
      # the wrong commit, before anything is published.
      - name: Check the tag matches the package version
        run: |
          if [ ! -f "dist/django_dump_die-${GITHUB_REF_NAME}.tar.gz" ] || [ ! -f "dist/django_dump_die-${GITHUB_REF_NAME}-py3-none-any.whl" ]; then
            echo "::error::The tag ${GITHUB_REF_NAME} doesn't match the package version. Built: $(ls dist | tr '\n' ' ')"
            exit 1
          fi

      - name: upload release distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/p/django-dump-die
    needs:
      - release-build
    permissions:
      id-token: write # Trusted publishing: PyPI accepts this job's ID token instead of a stored API token.

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

