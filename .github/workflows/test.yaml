name: Run Tests
on:
  push:
    branches:
      - main
  pull_request:

# The tests only need to read the repository.
permissions:
  contents: read

jobs:
  lint:
    name: Check formatting and lint with Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

  test:
    # Only run tests when NOT pushing tags. Assumes tests already passed from pushed commit that tag is based on.
    if: ${{ !startsWith(github.ref, 'refs/tags') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
        include:
          # Python 3.7 to 3.9 are not available on newer runner images.
          - os: ubuntu-22.04
            python-version: "3.7"
          - os: ubuntu-22.04
            python-version: "3.8"
          - os: ubuntu-22.04
            python-version: "3.9"
    name: Test Py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # Each tox environment installs its own Django and the package's test extras.
      - name: Install tox
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox tox-gh-actions

      - name: Test with tox
        run: tox

      - name: Rename coverage results
        run: mv .coverage .coverage.${{ matrix.python-version }}

      - name: Upload coverage results
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: .coverage.${{ matrix.python-version }}
          overwrite: true
          include-hidden-files: true

  # Python 3.6 is not available on any current runner image, so run it in Python's own Docker image.
  test-36:
    # Only run tests when NOT pushing tags. Assumes tests already passed from pushed commit that tag is based on.
    if: ${{ !startsWith(github.ref, 'refs/tags') }}
    name: Test Py3.6
    runs-on: ubuntu-latest
    container: python:3.6-bullseye
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Each tox environment installs its own Django and the package's test extras.
      # tox-gh-actions isn't used here: it registers a problem matcher by a path inside the container,
      # which the runner can't read, and that fails the step.
      - name: Install tox
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox

      - name: Test with tox
        run: tox -e py36-django22,py36-django32

      - name: Rename coverage results
        run: mv .coverage .coverage.3.6

      - name: Upload coverage results
        uses: actions/upload-artifact@v7
        with:
          name: coverage-3.6
          path: .coverage.3.6
          overwrite: true
          include-hidden-files: true

  coverage:
    name: Upload coverage results to Coveralls
    runs-on: ubuntu-latest
    # Need to run this after tests succeed so that coverage reflects test runs with all django and python combinations.
    needs:
      - test
      - test-36
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Retrieve coverage results
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Combine coverage files
        run: |
          python -m pip install coverage
          coverage --version
          coverage combine

      - name: Create coverage report
        run: coverage lcov

      - name: Upload Coverage to Coveralls
        uses: coverallsapp/github-action@v2
